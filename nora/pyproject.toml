[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-health-full-pipeline"
version = "0.3.5.dev20261020"
description = "Layered crisis, boundary, RAG, response-policy, generation, and output-safety orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.28,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
accounts = ["cryptography>=44,<52"]
runtime = [
  "cryptography>=44,<52", "jsonschema>=4.18,<5", "referencing>=0.37,<0.38",
  "accelerate>=1.0,<2", "bitsandbytes>=0.45", "faiss-cpu>=1.9", "numpy>=2.0,<3",
  "peft>=0.21.2,<1", "rank-bm25>=0.2.2", "sentence-transformers>=3.3",
  "scipy", "scikit-learn", "sentencepiece", "torch>=2.7,<3",
  "transformers>=5.15,<6", "gradio==6.30.0"
]
ml = [
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.45",
  "faiss-cpu>=1.9",
  "numpy>=2.0,<3",
  "peft>=0.21.2,<1",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=3.3",
  "scipy",
  "scikit-learn",
  "sentencepiece",
  "torch>=2.7,<3",
  "transformers>=5.15,<6",
]
test = [
  "cryptography>=44,<52",
  "jsonschema>=4.18,<5",
  "referencing>=0.37,<0.38",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
mental-health-pipeline = "mental_health_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mental_health_pipeline = ["web_nora/*.html", "web_nora/*.js", "web_nora/*.css", "web_nora/assets/*.png", "web_nora/assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["mental_health_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = true

